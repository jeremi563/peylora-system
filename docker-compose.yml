services:
  api:
    build: .
    command: sh -c "npm run db:migrate && npm run dev"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://daraja:daraja@postgres:5432/daraja_dev
      REDIS_URL: redis://redis:6379
      RATE_LIMIT_REDIS_URL: redis://redis:6379
      PORT: 5000
    ports:
      - "5000:5000"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  notification-worker:
    build: .
    command: sh -c "npm run db:migrate && npm run worker:notifications"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://daraja:daraja@postgres:5432/daraja_dev
      REDIS_URL: redis://redis:6379
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  webhook-worker:
    build: .
    command: sh -c "npm run db:migrate && npm run worker:webhooks"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://daraja:daraja@postgres:5432/daraja_dev
      REDIS_URL: redis://redis:6379
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: daraja_dev
      POSTGRES_USER: daraja
      POSTGRES_PASSWORD: daraja
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U daraja -d daraja_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data: